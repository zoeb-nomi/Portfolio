name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # prebuild (fetch-contributions) never fails the build: on network error it keeps the committed snapshot.
      - run: npm run build
      - run: npm run gate
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Preview + QA sweep
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: .astro/qa-report.json
          if-no-files-found: ignore
